name: MCAP Storage migration safety

on:
  pull_request:
    paths:
      - "js/omax*.js"
      - "js/core.js"
      - "tests/omax-*.test.js"
      - "tests/mcap-storage-*.test.js"
      - ".github/workflows/mcap-storage-test.yml"
      - "docs/firestore-sharded-cutover-PROPOSAL.rules"
      - "tests/mcap-firestore-cutover.emulator.cjs"
      - "tests/mcap-sharded-backend.emulator.cjs"
      - "tests/mcap-browser-smoke.browser.cjs"
      - "mcap-firestore-emulator.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Validate isolated migration modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax validation
        run: |
          node --check js/core.js
          node --check js/omaxAuthorityRouter.js
          node --check js/omaxShardedActivation.js
          node --check js/omaxShardedCommit.js
          node --check js/omaxShardedState.js
          node --check js/omaxWorkingShards.js
          node --check js/omaxShardedReadback.js
      - name: Migration regression suite
        run: >
          node --test
          tests/mcap-storage-foundation.test.js
          tests/mcap-storage-transport.test.js
          tests/omax-sharded-state.test.js
          tests/omax-working-storage.test.js
          tests/omax-working-shards.test.js
          tests/omax-sharded-commit.test.js
          tests/omax-sharded-activation.test.js
          tests/omax-authority-router.test.js

  cutover-rules:
    name: Test proposed cutover rules in disposable Firestore emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-mcap-security
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated emulator-only test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/mcap-firebase"
          npm install --prefix "$RUNNER_TEMP/mcap-firebase" --no-save --no-audit --no-fund \
            firebase-tools@15.32.1 firebase@12.16.0 @firebase/rules-unit-testing@5.0.0
          echo "NODE_PATH=$RUNNER_TEMP/mcap-firebase/node_modules" >> "$GITHUB_ENV"
      - name: Real Firestore rules emulator tests (demo project ONLY)
        run: |
          test "$GCLOUD_PROJECT" = "demo-mcap-security"
          "$RUNNER_TEMP/mcap-firebase/node_modules/.bin/firebase" emulators:exec \
            --only firestore --project demo-mcap-security \
            --config mcap-firestore-emulator.json \
            'node --test --test-concurrency=1 tests/mcap-firestore-cutover.emulator.cjs tests/mcap-sharded-backend.emulator.cjs'

  browser-smoke:
    name: Disposable website startup and save/reload smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Playwright (no repo package.json)
        run: |
          mkdir -p "$RUNNER_TEMP/mcap-browser"
          npm install --prefix "$RUNNER_TEMP/mcap-browser" --no-save --no-audit --no-fund playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/mcap-browser/node_modules" >> "$GITHUB_ENV"
      - name: Provision disposable headless Chromium
        run: "$RUNNER_TEMP/mcap-browser/node_modules/.bin/playwright install --with-deps chromium"
      - name: Run isolated OMAXDevSafe browser smoke (no Firebase traffic)
        run: |
          node --check tests/mcap-browser-smoke.browser.cjs
          node --test tests/mcap-browser-smoke.browser.cjs
